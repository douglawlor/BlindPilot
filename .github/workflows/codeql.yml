name: CodeQL

# Static security analysis of the Python source and the GitHub Actions
# workflows themselves. The schedule matters as much as the push trigger:
# a pattern already in the tree when a new advisory lands is only found
# by a run that nobody pushed for.
#
# The push and pull_request triggers are limited to the development branch,
# the branch the owner works on. The weekly schedule is kept as it is, because
# it is the one trigger that still runs when nothing is pushed at all. A
# manual run can be started against any branch and the trigger cannot filter
# that, so the guard job below decides.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  guard:
    name: Check the run concerns development
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Decide whether the run is allowed
        id: check
        shell: bash
        run: |
          set -euo pipefail

          # The upstream repository has flows of its own. If this file ever
          # reaches it, the guard refuses here rather than changing what
          # upstream does.
          if [ "${GITHUB_REPOSITORY}" = "serrebidev/BlindPilot" ]; then
            echo "allowed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Running in ${GITHUB_REPOSITORY}; only the fork's development branch runs flows in this repository."
            exit 0
          fi

          # A pull request runs against a merge ref, so GITHUB_REF names no
          # branch and the branch the run concerns is the base branch. The
          # trigger already limits pull requests to development; the check is
          # repeated here so the decision is made in one place.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if [ "${GITHUB_BASE_REF:-}" = "development" ]; then
              echo "allowed=true" >> "${GITHUB_OUTPUT}"
              echo "Pull request against development; the run is allowed."
            else
              echo "allowed=false" >> "${GITHUB_OUTPUT}"
              echo "::warning::Refusing a pull request against ${GITHUB_BASE_REF:-unknown}; only the development branch runs flows in this repository."
            fi
            exit 0
          fi

          # A push, a schedule and a manual run all name the branch they ran
          # on, so the ref decides. A manual run can be started against any
          # branch, which is the one thing the trigger cannot filter. The
          # weekly schedule runs against the default branch, which is the
          # development branch on the fork.
          if [ "${GITHUB_REF:-}" = "refs/heads/development" ]; then
            echo "allowed=true" >> "${GITHUB_OUTPUT}"
            echo "${GITHUB_REF:-} is the development branch; the run is allowed."
          else
            echo "allowed=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Refusing ${GITHUB_REF:-an unknown ref}; only the development branch runs flows in this repository."
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    # The guard decides whether the run concerns the development branch, so a
    # manual run against any other branch does no work at all.
    needs: [guard]
    if: success() && needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311
        with:
          category: /language:${{ matrix.language }}
