name: Build and release BlindPilot

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Applies to every job below. The build installs requirements-build.txt and
# runs PyInstaller - a great deal of third-party code on a runner - and it
# has no reason to be able to write to the repository. The one job that
# does is given it on its own.
permissions:
  contents: read

jobs:
  guard:
    name: Check the tag belongs to development
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_allowed: ${{ steps.check_tag.outputs.release_allowed }}
    steps:
      - name: Check out the full history
        # The ancestry test needs the commit the tag points at and every
        # commit on the development branch, so this fetches the whole
        # repository rather than the single commit of the tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check the tagged commit is on development
        id: check_tag
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "release_allowed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Not a tag push, so there is nothing to release."
            exit 0
          fi

          if [ "${GITHUB_REPOSITORY}" = "serrebidev/BlindPilot" ]; then
            echo "release_allowed=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::This workflow is running in the upstream repository; releases are published in the fork only."
            exit 0
          fi

          # origin is the fork this workflow runs in. The development branch
          # and the tag are fetched again because the answer is decided
          # against the fork as it is now, not as it was when the run started,
          # and because the guard does not depend on what the checkout step
          # happened to leave in the object store.
          git fetch --no-tags origin \
            "+refs/heads/development:refs/remotes/origin/development"

          # A tag that cannot be fetched is reported here rather than left to
          # fail later with an unexplained revision error from rev-parse.
          if ! git fetch --no-tags origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"; then
            echo "::error::Tag ${GITHUB_REF_NAME} could not be read from ${GITHUB_REPOSITORY}, so there is nothing to release."
            exit 1
          fi

          if ! tag_commit="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}" 2>/dev/null)"; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point at a commit in ${GITHUB_REPOSITORY}, so there is nothing to release."
            exit 1
          fi

          if git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/development; then
            echo "release_allowed=true" >> "${GITHUB_OUTPUT}"
            echo "Tag ${GITHUB_REF_NAME} is an ancestor of development, so the release will be published."
          else
            echo "release_allowed=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Tag ${GITHUB_REF_NAME} is not an ancestor of the development branch, so the release job is skipped."
          fi

  build:
    name: Build ${{ matrix.label }}
    # The build runs only for a tag the guard has confirmed is on the fork's
    # development branch. A PyInstaller build and the whole test suite are
    # slow, and artifacts for a tag the fork will never publish would be work
    # done for a ref other than the development branch.
    if: success() && needs.guard.outputs.release_allowed == 'true'
    needs: [guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025
            asset: BlindPilot-Windows-x64.zip
            kind: windows
          - label: macOS Apple Silicon
            runner: macos-15
            asset: BlindPilot-macOS-arm64.zip
            kind: macos
    runs-on: ${{ matrix.runner }}
    # PyInstaller and Inno Setup make this the slow one; a green build is
    # about fifteen minutes. The default is six hours, which is what a
    # deadlocked test or a subprocess that never exits would cost.
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-build.txt

      - name: Run regression tests
        run: python -m pytest -q -W error

      - name: Run static checks
        # bash on every runner: pwsh, the Windows default, reports only the
        # last command's exit code, so a ruff check failure would pass.
        shell: bash
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Generate application icons
        # The icon is rendered by a pure-stdlib tool into packaging/, over the
        # committed copies, so what ships always matches the tool even when
        # the copies are stale. BlindPilot.spec and the Inno installer consume
        # it from there.
        run: python tools/make_icon.py

      - name: Build Windows application
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          # What gets collected (winpty's OpenConsole.exe, websocket's runtime
          # submodules, accessible_output2's output drivers) and the icon live
          # in BlindPilot.spec, alongside the version and bundle metadata the
          # macOS build uses. One spec, both platforms.
          python -m PyInstaller --noconfirm --clean BlindPilot.spec
          $startupSmoke = Start-Process -FilePath .\dist\BlindPilot\BlindPilot.exe -ArgumentList "--startup-smoke" -PassThru -Wait
          if ($startupSmoke.ExitCode -ne 0) { throw "Packaged startup smoke test failed: $($startupSmoke.ExitCode)" }
          $guiSmoke = Start-Process -FilePath .\dist\BlindPilot\BlindPilot.exe -ArgumentList "--startup-gui-smoke" -PassThru -Wait
          if ($guiSmoke.ExitCode -ne 0) { throw "Packaged GUI startup smoke test failed: $($guiSmoke.ExitCode)" }
          $chatGuiSmoke = Start-Process -FilePath .\dist\BlindPilot\BlindPilot.exe -ArgumentList "--startup-chat-gui-smoke" -PassThru -Wait
          if ($chatGuiSmoke.ExitCode -ne 0) { throw "Packaged Chat GUI startup smoke test failed: $($chatGuiSmoke.ExitCode)" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path dist\BlindPilot -DestinationPath "artifacts\${{ matrix.asset }}" -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "artifacts\${{ matrix.asset }}").Hash.ToLowerInvariant()
          Set-Content -Encoding ascii -NoNewline -LiteralPath "artifacts\${{ matrix.asset }}.sha256" -Value "$hash  ${{ matrix.asset }}"
          choco install innosetup --no-progress -y
          $appVersion = (Select-String -LiteralPath blindpilot_app.py -Pattern '^APP_VERSION = "([^"]+)"$').Matches[0].Groups[1].Value
          $sourceDir = (Resolve-Path -LiteralPath dist\BlindPilot).Path
          $outputDir = (Resolve-Path -LiteralPath artifacts).Path
          $iscc = @(
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found after installation" }
          & $iscc "/DMyAppVersion=$appVersion" "/DMySourceDir=$sourceDir" "/DMyOutputDir=$outputDir" installer\BlindPilot.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with code $LASTEXITCODE" }
          $setupAsset = "BlindPilot-Setup-x64.exe"
          $setupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "artifacts\$setupAsset").Hash.ToLowerInvariant()
          Set-Content -Encoding ascii -NoNewline -LiteralPath "artifacts\$setupAsset.sha256" -Value "$setupHash  $setupAsset"

      - name: Build macOS application
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean BlindPilot.spec
          codesign --force --deep --sign - dist/BlindPilot.app
          dist/BlindPilot.app/Contents/MacOS/BlindPilot --startup-smoke
          dist/BlindPilot.app/Contents/MacOS/BlindPilot --startup-gui-smoke
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/BlindPilot.app "artifacts/${{ matrix.asset }}"
          cd artifacts
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.asset }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # Three things have to hold: the build produced the artifacts, the guard
    # allowed the tag, and the ref is a v* tag. The guard output is only set
    # when the guard job ran, so a guard that failed leaves it empty and the
    # release is skipped. always() is used because a skipped build would
    # otherwise make success() false and leave the reason hidden; the result
    # check is what stops a release from running without artifacts, so the
    # build and the release are skipped together.
    if: always() && needs.build.result == 'success' && needs.guard.outputs.release_allowed == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, guard]
    runs-on: ubuntu-24.04
    # Only here, and only this. This job installs nothing: it downloads the
    # artifacts the build made, checks their sums, and creates the release.
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check *.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The release is published in the repository this workflow runs in,
          # which is the fork. The upstream repository is never a publish
          # target, and the token used here cannot write to it.
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BlindPilot ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
