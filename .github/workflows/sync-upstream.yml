name: Sync with upstream

on:
  schedule:
    - cron: '17 3 * * *'  # Daily at 03:17 UTC
  workflow_dispatch:       # Also allow running it manually

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only this job writes: it merges the upstream branch into this one.
    # A file-level `permissions:` would hand every job in the file the same
    # token, and the job that needs one is the only job here.
    permissions:
      contents: write
    steps:
      - name: Sync fork branch
        # bash on every runner: pwsh, the Windows default, reports only the
        # last command's exit code, so a failure in the first line of a
        # multi-line step would pass.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/merge-upstream" \
            -f branch=main
