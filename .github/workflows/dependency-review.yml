name: Dependency Review

# Pull requests only. It diffs the dependency changes against the GitHub
# Advisory Database and fails when the PR introduces a known-vulnerable
# dependency, before the change reaches a release tag.
#
# Only pull requests that target the development branch are reviewed, so the
# result always describes the branch the owner is about to release from.
on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
