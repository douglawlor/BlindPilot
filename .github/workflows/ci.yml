name: Tests

# The release workflow runs these same checks, but only on a `v*` tag. That
# finds a broken commit on release day, with the build half made. This runs
# them on the commit instead, and only for the development branch: that is
# the branch the owner works on, so a run against any other branch would test
# code nobody intends to ship. A manual run can be started against any branch
# and the trigger cannot filter that, so the guard job below decides.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

# A branch pushed twice in quick succession only needs its newest commit
# tested; the older run is answering a question nobody is asking any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Check the run concerns development
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Decide whether the run is allowed
        id: check
        shell: bash
        run: |
          set -euo pipefail

          # The upstream repository has flows of its own. If this file ever
          # reaches it, the guard refuses here rather than changing what
          # upstream does.
          if [ "${GITHUB_REPOSITORY}" = "serrebidev/BlindPilot" ]; then
            echo "allowed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Running in ${GITHUB_REPOSITORY}; only the fork's development branch runs flows in this repository."
            exit 0
          fi

          # A pull request runs against a merge ref, so GITHUB_REF names no
          # branch and the branch the run concerns is the base branch. The
          # trigger already limits pull requests to development; the check is
          # repeated here so the decision is made in one place.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if [ "${GITHUB_BASE_REF:-}" = "development" ]; then
              echo "allowed=true" >> "${GITHUB_OUTPUT}"
              echo "Pull request against development; the run is allowed."
            else
              echo "allowed=false" >> "${GITHUB_OUTPUT}"
              echo "::warning::Refusing a pull request against ${GITHUB_BASE_REF:-unknown}; only the development branch runs flows in this repository."
            fi
            exit 0
          fi

          # A push, a schedule and a manual run all name the branch they ran
          # on, so the ref decides. A manual run can be started against any
          # branch, which is the one thing the trigger cannot filter.
          if [ "${GITHUB_REF:-}" = "refs/heads/development" ]; then
            echo "allowed=true" >> "${GITHUB_OUTPUT}"
            echo "${GITHUB_REF:-} is the development branch; the run is allowed."
          else
            echo "allowed=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Refusing ${GITHUB_REF:-an unknown ref}; only the development branch runs flows in this repository."
          fi

  test:
    name: ${{ matrix.label }}
    # The guard decides whether the run concerns the development branch, so a
    # manual run against any other branch does no work at all.
    needs: [guard]
    if: success() && needs.guard.outputs.allowed == 'true'
    strategy:
      # Every platform's result is wanted. A Windows failure says nothing
      # about whether Linux is also broken, and cancelling the others hides it.
      fail-fast: false
      matrix:
        include:
          - label: Windows
            runner: windows-2025
          - label: macOS
            runner: macos-15
          # Linux ships — linux_accessibility.py, the pexpect pseudo-terminal,
          # the POSIX process groups — and several tests skip themselves on
          # Windows and macOS, so without this runner they execute nowhere.
          - label: Linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    # A whole job, not just one test. The default is six hours, which is
    # what a deadlocked wait or a subprocess that never exits would cost.
    # A green run takes one to three minutes.
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # Linux uses the distribution's own Python, because that is the one
        # Ubuntu's prebuilt wxPython is built against. Ubuntu 24.04 ships
        # 3.12, so all three runners are on the same version regardless.
        if: runner.os != 'Linux'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install wxPython and a virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-wxgtk4.0 xvfb libsdl2-2.0-0 libwebkit2gtk-4.1-0
          # PyPI has no Linux wheel for wxPython, only a source archive that
          # needs the GTK development headers and the better part of an hour.
          # requirements.txt points pip at the distro wheel wxPython itself
          # publishes instead. Ubuntu's package above provides the GTK
          # runtime libraries that wheel links against, and libsdl2-2.0-0
          # covers the SDL2 library the 4.3 wheel needs and nothing else
          # here pulls in.
          #
          # libwebkit2gtk-4.1-0 is here for the conversation browser test.
          # That test imports wx.html2, which loads WebKitGTK when it is
          # imported, and pytest.importorskip only skips a module that is
          # cleanly absent. A missing shared library raises ImportError
          # from inside wx.html2, so pytest stops with a collection error
          # and the whole Linux run fails before a single test is run. The
          # package brings in GTK and the GStreamer libraries it needs as
          # hard dependencies, so nothing else has to be named here.
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Never silently fall back to compiling wxPython: that turns a
          # missing wheel into a forty-minute job that fails anyway.
          python -m pip install --only-binary=wxPython -r requirements-build.txt
          python -c "import wx; print('wxPython', wx.version())"

      - name: Run the tests
        shell: bash
        # -W error for the same reason the release build uses it: a warning
        # nobody reads is how an invalid escape sequence or a deprecated call
        # reaches a release. xvfb-run gives wxPython a display to open into.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m pytest -q -W error
          else
            python -m pytest -q -W error
          fi

      - name: Check the application still starts
        shell: bash
        # Every menu, control and binding is created in the frame's __init__,
        # and the tests drive handlers on stubs. A stub always has whatever it
        # is handed, so it cannot notice a menu built before the thing it
        # describes exists. This can, and did.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python blind_pilot.py --startup-smoke
            xvfb-run -a python blind_pilot.py --startup-gui-smoke
          else
            python blind_pilot.py --startup-smoke
            python blind_pilot.py --startup-gui-smoke
          fi

      - name: Run static checks
        # bash on every runner: pwsh, the Windows default, reports only the
        # last command's exit code, so a ruff check failure would pass.
        shell: bash
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Check types
        # One runner is enough: mypy.ini pins `platform = win32`, because this
        # code carries both halves of every platform split behind runtime
        # checks no checker can read. Running it three times would report the
        # same thing three times, or three different things for no reason.
        if: runner.os == 'Windows'
        run: python -m mypy
